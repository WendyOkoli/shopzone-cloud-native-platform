version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: shopzone-postgres

    restart: always

    environment:
      POSTGRES_USER: shopzone
      POSTGRES_PASSWORD: ShopZone123!
      POSTGRES_DB: shopzone

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build: .

    container_name: shopzone-app

    ports:
      - "3000:3000"

    env_file:
      - .env

    depends_on:
      - postgres

volumes:
  postgres-data: